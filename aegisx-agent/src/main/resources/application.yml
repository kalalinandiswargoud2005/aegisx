server:
  port: 8081 # Run agent on a different port if running locally alongside backend

spring:
  application:
    name: aegisx-agent
  datasource:
    url: jdbc:sqlite:aegisx-cache.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: false

aegisx:
  backend:
    url: ${SERVER_URL:http://localhost:8080}
    api-key: ${API_KEY:default-api-key}
  agent:
    id: ${DEVICE_ID:} # Will be generated if empty
    heartbeat-interval: ${HEARTBEAT_INTERVAL:30000}

logging:
  level:
    root: INFO
    com.aegisx.agent: DEBUG
  file:
    name: aegisx-agent.log
